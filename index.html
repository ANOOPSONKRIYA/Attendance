<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Class Attendance</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome for social media icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1 class="title">📋 Class Attendance</h1>

    <!-- Sticky header: search + live counter -->
    <div class="header-bar">
      <input
        id="searchBox"
        type="search"
        placeholder="🔎 Search roll no or name… (e.g., 08 or Anoop)"
        aria-label="Search students"
      />
      <div id="liveCounter" aria-live="polite">✔ Present: 0 | ✖ Absent: 0</div>
    </div>

    <!-- Scrollable list container -->
    <div class="student-list-container" id="listWrap">
      <form id="attendanceForm" class="student-list" aria-label="Student list">
        <!-- Filled by script.js -->
      </form>
    </div>

    <!-- Buttons -->
    <div class="button-group">
      <button type="button" id="submitBtn">✅ Submit</button>
      <button type="button" id="copyBtn" style="display:none;">📋 Copy</button>
      <button type="button" id="themeToggle">☀️ Light Mode</button>
    </div>

    <!-- Output -->
    <p id="present-list"></p>
    <div class="output-box">
      <textarea id="attendanceOutput" readonly></textarea>
    </div>

    <!-- Footer -->
    <footer class="site-footer" role="contentinfo">
      <div class="made-by">
        Made with <span class="heart">❣️</span> &nbsp;and&nbsp; <span class="coffee">☕</span>
        &nbsp; by <strong>Anoop</strong>
      </div>

      <div class="social-icons" aria-hidden="false">
        <a href="https://github.com/ANOOPSONKRIYA" target="_blank" rel="noopener noreferrer" aria-label="GitHub — Anoop">
          <i class="fab fa-github fa-lg" aria-hidden="true"></i>
        </a>
        <a href="https://www.linkedin.com/in/anoopsonkriya/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn — Anoop">
          <i class="fab fa-linkedin fa-lg" aria-hidden="true"></i>
        </a>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
